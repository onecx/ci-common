name: trivy

on:
  workflow_call:
    inputs: 
      native:
        description: 'Native image'
        default: false
        required: false
        type: boolean
jobs:
  trivy:
    name: docker trivy scan
    # runs-on: [ self-hosted, aws ]
    runs-on: ubuntu-latest
    env:
      TRIVY_DEPENDENCY_TREE: 'true'
    steps:
    - uses: lorislab/install-samo-action@v2
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    # set build env variables
    - name: Create build env variables
      run: |
        if [[ ${{ fromJSON(inputs.native) }} ]]; then
            echo "APPLICATION_VERSION=$(samo project version)-native" >> $GITHUB_ENV
        else
            echo "APPLICATION_VERSION=$(samo project version)" >> $GITHUB_ENV
        fi
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: 'ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ env.APPLICATION_VERSION }}'
        severity: 'HIGH,CRITICAL'
        format: table
